
 ```yaml name: Publicar Dashboard on: push: branches: [main] jobs: deploy: runs-on: ubuntu-latest steps: - uses: actions/checkout@v4 - uses: r-lib/actions/setup-r@v2 - uses: r-lib/actions/setup-pandoc@v2 - name: Instalar paquetes de R run: | install.packages(c("rmarkdown", "flexdashboard", "dplyr", "ggplot2", "scales", "tidyr", "stringr", "jsonlite", "knitr", "DT")) shell: Rscript {0} - name: Compilar dashboard run: rmarkdown::render("dashboard.Rmd", output_file = "index.html") shell: Rscript {0} - name: Publicar en GitHub Pages uses: peaceiris/actions-gh-pages@v4 with: github_token: ${{ secrets.GITHUB_TOKEN }} publish_dir: . publish_branch: gh-pages ```
 